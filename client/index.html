<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Manju Group | Sri Lanka's Premier Multi-Brand Group</title>
    <meta name="description" content="Manju Group is Sri Lanka's trusted conglomerate offering high-quality DEW Motors electric bikes, DEW Plus smart TVs, commercial RO water purification systems, and inverter ACs with nationwide warranty." />
    <meta name="keywords" content="Manju Group, Sri Lanka, DEW Motors, electric bikes Sri Lanka, DEW Plus Smart TV, RO water purifier, inverter AC, home appliances Sri Lanka, buy online Sri Lanka" />
    <meta name="author" content="Manju Group" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#0052B4" />

    <!-- Canonical -->
    <link rel="canonical" href="https://manjugroup.lk/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://manjugroup.lk/" />
    <meta property="og:site_name" content="Manju Group Sri Lanka" />
    <meta property="og:title" content="Manju Group | Sri Lanka's Premier Multi-Brand Group" />
    <meta property="og:description" content="Explore DEW Motors electric bikes, DEW Plus 4K Smart TVs, and industrial water purification systems from Sri Lanka's trusted conglomerate." />
    <meta property="og:image" content="https://manjugroup.lk/manju-logo-transparent.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://manjugroup.lk/" />
    <meta name="twitter:title" content="Manju Group | Sri Lanka's Premier Multi-Brand Group" />
    <meta name="twitter:description" content="Explore DEW Motors electric bikes, DEW Plus 4K Smart TVs, and industrial water purification systems from Sri Lanka's trusted conglomerate." />
    <meta name="twitter:image" content="https://manjugroup.lk/manju-logo-transparent.webp" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://manjugroup.lk/#organization",
          "name": "Manju Group",
          "url": "https://manjugroup.lk",
          "logo": "https://manjugroup.lk/manju-logo-transparent.webp",
          "description": "Sri Lanka's leading conglomerate specializing in electric mobility, consumer electronics, and water solutions.",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+94-11-234-5678",
            "contactType": "customer service",
            "areaServed": "LK",
            "availableLanguage": ["English", "Sinhala", "Tamil"]
          },
          "sameAs": [
            "https://www.facebook.com/ManjuEnterprisesLK"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://manjugroup.lk/#website",
          "url": "https://manjugroup.lk",
          "name": "Manju Group Official Website",
          "publisher": {
            "@id": "https://manjugroup.lk/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://manjugroup.lk/products?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"

</html>
